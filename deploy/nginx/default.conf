server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # IP real del visitante detrás de Cloudflare (si se usa).
    real_ip_header CF-Connecting-IP;

    # El micrositio SÍ recibe subidas (documentos hasta 25 MB por
    # ReglasDocumento::TAMANO_MAXIMO_KB, imágenes de noticias y galería).
    # Se deja margen sobre el límite de aplicación (post_max_size en
    # php.ini es la cota real que aplica primero).
    client_max_body_size 30M;

    # NOTA: los headers de seguridad (CSP, X-Frame-Options: DENY, nosniff,
    # Referrer-Policy, Permissions-Policy, HSTS) los emite el middleware de
    # seguridad de Laravel. No se duplican aquí para evitar cabeceras en
    # conflicto.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # El nginx/Cloudflare externo termina TLS; se informa a PHP que la
        # conexión original fue HTTPS para que Laravel marque las cookies
        # como Secure y emita HSTS (request->secure()).
        fastcgi_param HTTPS on;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Livewire: siempre a PHP, nunca como archivo estático. Incluye el
    # endpoint de subida de archivos temporales (livewire/upload-file).
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Assets estáticos versionados por Vite (hash en el nombre): cache larga.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Documentos del repositorio público (PDF, DOC, XLS, CSV): cache
    # moderada — el contenido se reemplaza por versión (RF-CAR-002), no es
    # immutable.
    location ~* \.(pdf|docx?|xlsx?|csv)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Bloquear archivos ocultos (.env, .git, etc.).
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
