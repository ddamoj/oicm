[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; =============================================================
; Nginx — servidor web (proxy hacia PHP-FPM)
; =============================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================
; PHP-FPM — procesa Laravel + Livewire
; =============================================================
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Sin queue worker ni scheduler: nada en el código actual despacha Jobs a
; cola (QUEUE_CONNECTION=database es el default de Laravel, pero no hay
; clases ShouldQueue en uso). Si más adelante se agregan (correos,
; notificaciones), aquí se añade el bloque [program:worker] con
; `php artisan queue:work`.
