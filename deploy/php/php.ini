; =============================================================
; Micrositio OICM — PHP para despliegue
; =============================================================

; Ocultar la versión de PHP en los headers HTTP.
expose_php = Off

; Memoria por request (holgada para composer/artisan, renders Livewire y
; el redimensionado de imágenes con gd).
memory_limit = 256M

max_execution_time = 60

; El micrositio SÍ recibe subidas de usuarios autenticados (documentos,
; imágenes de noticias, galería). ReglasDocumento::TAMANO_MAXIMO_KB fija el
; límite de aplicación en 25 MB; aquí se deja margen (post_max_size debe
; ser mayor que upload_max_filesize para que el error lo reporte Laravel,
; no un 413 silencioso de PHP).
upload_max_filesize = 30M
post_max_size = 32M

; Zona horaria del Municipio de Oaxaca.
date.timezone = America/Mexico_City

; Errores: nunca mostrarlos al usuario (defensa en profundidad junto con
; APP_DEBUG=false). Se registran en el log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Cookies de sesión PHP endurecidas. El flag Secure lo gestiona Laravel
; (SESSION_SECURE_COOKIE) sobre su propia cookie; aquí se cubre la de PHP.
session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache: acelera cacheando el bytecode compilado.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.save_comments = 1
